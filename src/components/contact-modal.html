    <!-- ── CONTACT MODAL ───────────────────────────────────────────────────── -->
    <div x-show="isContactOpen" x-cloak @keydown.escape.window="isContactOpen = false"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">

        <div @click.away="isContactOpen = false"
            class="bg-card-bg card-border w-full max-w-lg max-h-[90vh] overflow-y-auto p-6 space-y-4 relative shadow-2xl">
            <button @click="isContactOpen = false"
                class="absolute top-3 right-3 w-7 h-7 bg-white pill-border font-black text-xs hover:bg-slate-900 hover:text-white">✕</button>
            <h2 class="text-xl font-black uppercase tracking-tight">CONTACTER LE CLUB</h2>
            <div class="break-words space-y-2 text-xs font-mono">
                <div class="p-3 bg-white pill-border">
                    <span class="block text-slate-500 font-sans text-[10px] uppercase font-bold">EMAIL</span>
                    <div class="mt-1 flex flex-wrap items-center gap-2 font-sans">
                        <span class="text-sm font-bold text-slate-900" x-text="contactEmail"></span>
                        <button type="button" @click="copyContactEmail()"
                            :aria-label="contactEmailCopied ? 'Adresse copiée' : 'Copier l’adresse e-mail'"
                            class="inline-flex items-center gap-1 text-[10px] font-bold text-slate-600 hover:text-slate-900">
                            <template x-if="!contactEmailCopied">
                                <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                    <rect x="8" y="8" width="12" height="12" rx="2" stroke-width="2"></rect>
                                    <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" stroke-width="2"></path>
                                </svg>
                            </template>
                            <template x-if="contactEmailCopied">
                                <svg class="h-3.5 w-3.5 text-emerald-700" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                    <path d="m5 12 4 4L19 6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                                </svg>
                            </template>
                            <span x-text="contactEmailCopied ? 'Copié !' : 'Copier'"></span>
                        </button>
                    </div>
                    <p x-show="contactCopyError" x-text="contactCopyError" role="alert"
                        class="mt-1 font-sans text-[10px] font-semibold text-red-800"></p>
                </div>
                <div class="p-3 bg-white pill-border">
                    <span class="block text-slate-500 font-sans text-[10px] uppercase font-bold">INSTAGRAM</span>
                    <a href="https://instagram.com/acelspace78" target="_blank" rel="noopener noreferrer" class="font-bold text-slate-900 text-sm hover:underline">@acelspace78 ↗</a>
                </div>
            </div>
            <form @submit.prevent="submitContact($event)" class="p-4 bg-white pill-border space-y-3">
                <h3 class="font-black uppercase text-sm">Envoyer un message</h3>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <label class="block space-y-1 text-xs font-bold">
                        <span>Nom <span aria-hidden="true">*</span></span>
                        <input name="nom" type="text" required maxlength="100" autocomplete="family-name"
                            class="w-full p-2 bg-card-bg pill-border font-medium">
                    </label>
                    <label class="block space-y-1 text-xs font-bold">
                        <span>Prénom <span aria-hidden="true">*</span></span>
                        <input name="prenom" type="text" required maxlength="100" autocomplete="given-name"
                            class="w-full p-2 bg-card-bg pill-border font-medium">
                    </label>
                </div>
                <label class="block space-y-1 text-xs font-bold">
                    <span>Adresse e-mail <span aria-hidden="true">*</span></span>
                    <input name="email" type="email" required maxlength="254" autocomplete="email"
                        class="w-full p-2 bg-card-bg pill-border font-medium">
                </label>
                <label class="block space-y-1 text-xs font-bold">
                    <span>Message <span aria-hidden="true">*</span></span>
                    <textarea name="message" required maxlength="5000" rows="4"
                        class="w-full p-2 bg-card-bg pill-border font-medium resize-y"></textarea>
                </label>

                <!-- Widget Turnstile anti-bot contact -->
                <div x-show="turnstileEnabled" class="pt-1 flex justify-center">
                    <div class="cf-turnstile"
                         data-sitekey="0x4AAAAAAGNfsCaXr7okaNwc"
                         data-callback="onContactTurnstileResolved"
                         data-expired-callback="onContactTurnstileExpired"
                         data-error-callback="onContactTurnstileExpired"
                         data-theme="light">
                    </div>
                </div>
                <button type="submit" :disabled="contactSubmitting || (turnstileEnabled && !contactTurnstileToken)"
                    class="w-full py-2 bg-slate-900 text-white font-black text-xs uppercase pill-border hover:bg-slate-800 disabled:opacity-60 cursor-pointer">
                    <span x-text="contactSubmitting ? 'ENVOI…' : 'ENVOYER'"></span>
                </button>
                <p x-show="contactSuccess" x-text="contactSuccess" role="status" aria-live="polite"
                    class="text-xs font-bold text-emerald-800"></p>
                <p x-show="contactError" x-text="contactError" role="alert"
                    class="text-xs font-bold text-red-800"></p>
            </form>
            <button @click="isContactOpen = false"
                class="w-full py-2 bg-slate-900 text-white font-black text-xs uppercase pill-border">FERMER</button>
        </div>
    </div>
