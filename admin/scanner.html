<!DOCTYPE html>
<html lang="fr" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Scanner de commandes — AcelSpace</title>
    <link rel="stylesheet" href="/src/style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script type="module" src="./scanner.js"></script>
</head>

<body class="min-h-full bg-slate-950 text-white antialiased">
    <main class="mx-auto flex min-h-screen w-full max-w-xl flex-col items-center justify-center gap-6 px-4 py-8">
        <header class="w-full text-center">
            <a href="/admin" class="text-sm font-bold text-sky-300 underline underline-offset-4">← Retour à l’administration</a>
            <h1 class="mt-5 text-2xl font-black uppercase tracking-tight">Scanner de commandes</h1>
            <p class="mt-2 text-sm text-slate-300">Placez le QR code de la commande devant la caméra.</p>
        </header>

        <div id="scan-message" class="hidden w-full rounded-lg border-2 px-4 py-5 text-center text-xl font-black" role="status" aria-live="polite"></div>

        <section class="w-full rounded-2xl bg-white p-3 shadow-2xl">
            <div id="qr-reader" class="mx-auto w-full overflow-hidden rounded-xl"></div>
        </section>

        <p id="scanner-error" class="hidden w-full rounded-lg border-2 border-red-300 bg-red-950 px-4 py-3 text-center text-sm font-bold text-red-100" role="alert"></p>
        <p class="text-center text-xs text-slate-400">Autorisez l’accès à la caméra pour commencer le scan.</p>
    </main>
</body>

</html>
